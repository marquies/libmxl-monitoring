name: CI

# Builds and tests the library both ways it is consumed: on its own against
# the libmxl that go-mxl-builder installs, and as a subdirectory of the MXL
# checkout that libmxl is built from, the way a media function built in that
# tree links it.
# The concurrency tests run again under ThreadSanitizer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The repository and commit go-mxl-builder's libmxl is built from, as named
  # in go-mxl's .github/libmxl.version; they move with the image tag below.
  MXL_SRC: https://github.com/qvest-digital/mxl.git
  MXL_REF: c259243931333497e61faabeedac8048915dcb2b
  # vcpkg's binary cache lives under /root in the image; a container job's
  # HOME is elsewhere.
  VCPKG_DEFAULT_BINARY_CACHE: /root/.cache/vcpkg/archives

jobs:
  # With the OTLP exporter, whose opentelemetry-cpp the image does not carry:
  # vcpkg builds it once per manifest into a cache of this workflow's own.
  standalone:
    runs-on: ubuntu-latest
    container: ghcr.io/qvest-digital/go-mxl-builder:1.1.0-rc.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .vcpkg-otlp
          key: vcpkg-otlp-${{ hashFiles('vcpkg.json') }}
      - name: Configure
        run: >
          mkdir -p .vcpkg-otlp &&
          VCPKG_BINARY_SOURCES="clear;default,read;files,$PWD/.vcpkg-otlp,readwrite"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=/root/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_PREFIX_PATH=/opt/libmxl
          -DVCPKG_MANIFEST_FEATURES=otlp -DMXL_MONITORING_OTLP=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: build/tests/mxl-monitoring-tests
        env:
          LD_LIBRARY_PATH: /opt/libmxl/lib

  in-tree:
    runs-on: ubuntu-latest
    container: ghcr.io/qvest-digital/go-mxl-builder:1.1.0-rc.7
    steps:
      - uses: actions/checkout@v4
        with:
          path: libmxl-monitoring
      # A full clone: GitHub refuses a shallow fetch of an arbitrary commit by SHA.
      - name: Check out MXL
        run: |
          git clone "$MXL_SRC" mxl
          git -C mxl checkout "$MXL_REF"
          mv libmxl-monitoring mxl/
          echo 'add_subdirectory(libmxl-monitoring)' >> mxl/CMakeLists.txt
      - name: Configure
        run: >
          cmake -S mxl -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_UTILS=OFF -DBUILD_DOCS=OFF
          -DMXL_MONITORING_BUILD_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE=/root/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build build --target mxl-monitoring-tests
      - name: Test
        run: build/libmxl-monitoring/tests/mxl-monitoring-tests
        env:
          LD_LIBRARY_PATH: build/lib

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ThreadSanitizer cannot map its shadow memory with the runner kernel's
      # default address randomisation, and a container cannot lower it.
      - name: Reduce address randomisation
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build and test
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VCPKG_DEFAULT_BINARY_CACHE \
            ghcr.io/qvest-digital/go-mxl-builder:1.1.0-rc.7 sh -ec '
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
                -DCMAKE_TOOLCHAIN_FILE=/root/vcpkg/scripts/buildsystems/vcpkg.cmake \
                -DCMAKE_PREFIX_PATH=/opt/libmxl
              cmake --build build
              LD_LIBRARY_PATH=/opt/libmxl/lib build/tests/mxl-monitoring-tests "[concurrency],[recording],[events],[http]"'
